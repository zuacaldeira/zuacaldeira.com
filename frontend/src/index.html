<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Alexandre Caldeira — Researcher. Developer. Educator. Runner.</title>
    <base href="/" />
    <!-- The theme before first paint (THEME-10, D25): the saved choice, else the device's setting,
         the rule ThemeService applies once Angular runs (both read theme-rule.cases.json in tests). -->
    <script>
      try {
        var zcTheme = localStorage.getItem('zc-theme');
        if (zcTheme === 'dark' || (zcTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark-theme');
        }
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Alexandre Caldeira — Researcher in Session Types, Software Developer (Angular + Spring Boot), Erzieher in Ausbildung, and amateur runner in Berlin."
    />
    <meta property="og:title" content="Alexandre Caldeira" />
    <meta property="og:description" content="Researcher. Developer. Educator. Runner." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zuacaldeira.com" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"

    />
