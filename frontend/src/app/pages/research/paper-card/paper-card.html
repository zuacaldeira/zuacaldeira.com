<section class="rs-paper">
  <div class="rs-paper__in">
    <article class="rs-paper__card">
      <div class="rs-paper__main">
        <p class="rs-paper__when">
          <span class="rs-paper__year">{{ shared.year }}</span> ·
          <span class="rs-paper__kind">{{ paper.kind }}</span>
        </p>
        <h2 class="rs-paper__title" translate="no" [attr.lang]="english ? null : 'en'">
          {{ shared.paperTitle }}
        </h2>
        <p class="rs-paper__author" translate="no"><b>{{ paper.author }}</b></p>
        <p class="rs-paper__venue" translate="no">{{ paper.venue }}</p>
        <p class="rs-paper__note">{{ paper.note }}</p>
        <a class="rs-paper__pdf" [href]="shared.pdfUrl" type="application/pdf" hreflang="en">{{
          shared.read
        }}</a>
      </div>
      <div class="rs-paper__side">
        <h3 class="rs-paper__label">{{ paper.abstractLabel }}</h3>
        @if (!english) {
          <p class="rs-paper__lang">{{ paper.inEnglish }}</p>
        }
        <blockquote class="rs-paper__abstract" translate="no" [attr.lang]="english ? null : 'en'">
          <p>{{ paper.abstract }}</p>
        </blockquote>
      </div>
    </article>
  </div>
</section>
