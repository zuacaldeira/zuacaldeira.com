<section class="band">
  <div class="band__in">
    <p class="band__paper">
      {{ paper.eyebrow }} — <span translate="no">{{ paper.paperTitle }}</span> · ICE {{ paper.year }}
    </p>
    <p class="band__kicker">{{ kicker() }}</p>
    @if (theorem) {
      <p class="band__label">
        {{ paper.theorem }} {{ theorem.number }} · <span translate="no">{{ theorem.name }}</span>
      </p>
      <p class="band__statement" translate="no">{{ theorem.text }}</p>
    }
    <p class="band__evidence">{{ paper.evidence }}</p>
    <div class="band__actions">
      <a class="band__btn band__btn--filled" [href]="paper.pdfUrl">{{ paper.read }}</a>
      <a class="band__btn band__btn--outlined" [routerLink]="research">{{ paper.allResearch }}</a>
    </div>
  </div>
</section>
