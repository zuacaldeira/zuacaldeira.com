<a [attr.href]="skipHref()" class="skip-link">{{ t().common.skipToContent }}</a>

<header>
  <mat-toolbar>
    <div class="toolbar-content">
      <a [routerLink]="link('home')" class="logo" aria-label="Alexandre Zua Caldeira">
        <app-logo-mark />
        <span class="logo-name" translate="no">Zua Caldeira</span>
      </a>
      <nav>
        <app-zc-desktop-menu-items />
      </nav>
      <div class="toolbar-actions">
        <app-language-links />
        <!-- One inline span for sign and words: the link is inline-flex, which would drop the
             space at the edge of a bare text item (SHELL-17b). -->
        <a [routerLink]="link('contact')" class="nav-cta"
          ><span><span aria-hidden="true">⊥</span> {{ t().common.contactCta }}</span></a
        >
        <app-theme-toggle />
      </div>
    </div>
  </mat-toolbar>
</header>

<main id="main-content" tabindex="-1">
  <router-outlet />
</main>

<app-footer />
