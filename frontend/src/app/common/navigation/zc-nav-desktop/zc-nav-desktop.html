<a href="#main-content" class="skip-link">{{ t().common.skipToContent }}</a>

<header>

    <div class="toolbar-content">
      <a [routerLink]="link('home')" class="logo" aria-label="Home">
        <span class="logo-text">zc</span>
      </a>
      <nav>
        <app-zc-desktop-menu-items />
      </nav>
      <div class="toolbar-actions">
        <app-language-links />

<main id="main-content">

</main>

<app-footer />
