<a [attr.href]="skipHref()" class="skip-link">{{ t().common.skipToContent }}</a>

<header>
  <mat-toolbar>
    <div class="toolbar-content">
      <a [routerLink]="link('home')" class="logo" aria-label="Home">
        <span class="logo-text">zc</span>
      </a>
      <nav>
        <app-zc-desktop-menu-items />
      </nav>
      <div class="toolbar-actions">
        <app-language-links />
        <a mat-flat-button [routerLink]="link('contact')" class="nav-cta"
          ><span aria-hidden="true">⊥</span> {{ t().common.contactCta }}</a
        >
        <app-theme-toggle />
      </div>
    </div>
  </mat-toolbar>
</header>

<main id="main-content" tabindex="-1">
  <router-outlet />
</main>

<app-footer />
