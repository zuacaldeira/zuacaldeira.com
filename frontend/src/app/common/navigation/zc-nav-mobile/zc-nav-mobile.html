<a href="#main-content" class="skip-link">{{ t().common.skipToContent }}</a>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="sidenav"
    fixedInViewport
    position="end"
    [attr.role]="'dialog'"
    [attr.aria-label]="t().common.menu"
    [mode]="'over'"
    [opened]="false"
  >
    <mat-toolbar class="sidenav-header">
      <span>{{ t().common.menu }}</span>
      <span class="spacer"></span>
      <button mat-icon-button (click)="drawer.close()" [attr.aria-label]="t().common.closeMenu">
        <mat-icon>close</mat-icon>
      </button>
    </mat-toolbar>
    <nav [attr.aria-label]="t().common.mainNav">
      <app-zc-sidenav-menu-items />
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <header>
      <mat-toolbar class="mobile-toolbar">
        <a [routerLink]="link('home')" class="logo" aria-label="Home">
          <span class="logo-text">zc</span>
        </a>
        <span class="spacer"></span>
        <app-language-links />
        <app-theme-toggle />
        <button
          type="button"
          class="menu-button"
          [attr.aria-label]="t().common.openMenu"
          mat-icon-button
          (click)="toggle(drawer)"
        >
          <mat-icon>menu</mat-icon>
        </button>
      </mat-toolbar>
    </header>

    <main id="main-content">
      <router-outlet />
    </main>

    <app-footer />
  </mat-sidenav-content>
</mat-sidenav-container>
