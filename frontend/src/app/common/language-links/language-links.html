<nav [attr.aria-label]="t().common.language">
  @for (link of links; track link.lang) {
    @let code = link.lang.toUpperCase();
    <a
      [routerLink]="link.href"
      [attr.hreflang]="link.lang"
      [attr.lang]="link.lang"
      [attr.aria-label]="names[link.lang] + ' (' + code + ')'"
      [attr.aria-current]="link.current ? 'page' : null"
      >{{ code }}</a
    >
  }
</nav>
