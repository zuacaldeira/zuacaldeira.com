<mat-nav-list>
  @for (item of navItems(); track item.page) {
    <a mat-list-item [routerLink]="item.link" routerLinkActive="active-link">
      <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
      <span matListItemTitle>
        @if (item.page === 'contact') {
          ⊥
        }
        {{ item.label }}</span
      >
    </a>
  }
</mat-nav-list>
