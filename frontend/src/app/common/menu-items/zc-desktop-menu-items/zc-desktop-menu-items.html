<div class="desktop-menu-items" role="navigation" aria-label="Main navigation">
  @for (item of navItems(); track item.page) {
    <a
      [routerLink]="item.link"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: item.page === 'home' }"
    >
      {{ item.label }}
    </a>
  }
</div>
