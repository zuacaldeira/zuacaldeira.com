# nginx inside the web container. TLS, HSTS, CSP and the other security headers come
# from the host nginx in front of it.
#
# Cache-Control is set once at server level through the map. A location with its own
# add_header would drop every server-level header for its responses.

map $uri $zc_cache_control {
    ~*\.html$                                   "public, max-age=300";
    ~*\.(js|css|woff2?|png|jpe?g|webp|svg|ico)$ "public, max-age=31536000, immutable";
    default                                     "public, max-age=300";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects such as /home -> /home/ keep the visitor's host and port, not :8080.
    absolute_redirect off;

    add_header Cache-Control $zc_cache_control always;

    # Prerendered routes resolve to <route>/index.html; anything unknown, /fr/home included,
    # answers 404 with the prerendered 404 page (HOME-PAGE-06, D9), copied to 404.html by the build.
    # $uri/index.html first, so /en/home answers 200 itself, not nginx's 301 to /en/home/ (D46).
    # A path ending in / answers 301 without it, the query string kept (D47). Inside this location,
    # not at server level, so the old paths below still take one hop.
    location / {
        rewrite ^(/.+)/$ $1 permanent;
        try_files $uri $uri/index.html $uri/ =404;
    }
    error_page 404 /404.html;

    # Old links (HOME-PAGE-05, D2) lead to the English page in one hop: a trailing slash is
    # dropped, the query string kept (D34′).
    location ~ ^/(home|about|research|running|contact)/?$ {
        return 301 /en/$1$is_args$args;
    }
}
