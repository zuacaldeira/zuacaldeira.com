<section class="hero">
  <div class="frieze" aria-hidden="true"></div>

  <div class="hero-panel">
    <p class="hero-eyebrow">{{ t().hero.location }}</p>
    <h1 class="hero-name">Alexandre Zua Caldeira</h1>
    <p class="hero-tagline">{{ t().hero.tagline }}</p>

    <div class="hero-actions">
      <a mat-flat-button routerLink="/about" class="hero-cta">{{ t().hero.aboutCta }}</a>
      <a mat-stroked-button routerLink="/contact">{{ t().hero.contactCta }}</a>
    </div>

    <figure class="hero-wall">
      <app-lattice-wall />
      <figcaption>
        108 protocols, 41 distinct lattices &mdash; 15 non-distributive, in
        <span class="ochre-key">ochre</span>. From <em>Session Type State Spaces Form Lattices</em>,
        ICE 2026.
      </figcaption>
    </figure>
  </div>
</section>
