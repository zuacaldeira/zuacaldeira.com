<section class="hero">
  <div class="hero__photo" role="img" aria-label="Misty sunrise over a field near Berlin"></div>

  <div class="hero__glass" aria-hidden="true"></div>
  <div class="hero__lattice" aria-hidden="true"><app-lattice-wall /></div>

  <div class="hero__content">
    <p class="hero__eyebrow">{{ t().hero.location }}</p>
    <h1 class="hero__name">Alexandre Zua Caldeira</h1>
    <p class="hero__tagline">{{ t().hero.tagline }}</p>
    <div class="hero__actions">
      <a mat-flat-button routerLink="/about" class="hero__cta">{{ t().hero.aboutCta }}</a>
      <a mat-stroked-button routerLink="/contact" class="hero__cta-ghost">
        {{ t().hero.contactCta }}
      </a>
    </div>
  </div>

  <p class="hero__credit" aria-hidden="true">
    behind: 74 benchmark lattices (R2&prime;), 47 non-distributive
  </p>
</section>
