# zuacaldeira.com — personal site (Angular prerendered static build).
#
# Deployed from zuacaldeira/zuacaldeira.com — files rsynced to /var/www/zuacaldeira.com.
# Installed as /etc/nginx/sites-available/zuacaldeira.com on the shared VPS; this copy in
# infra/live/ is the source.
#
# Headers: every add_header sits at server level (here and in the included
# zuacaldeira-ssl-params.conf), never inside a location. A location with its own add_header
# drops all server-level headers for its responses; until 2026-10-28 the per-type
# Cache-Control locations stripped HSTS, CSP and X-Frame-Options from every page and asset.
# Cache-Control now varies by file type through the map instead.

map $uri $zc_live_cache_control {
    ~*\.html$                                   "public, max-age=300";
    ~*\.(js|css|woff2?|png|jpe?g|webp|svg|ico)$ "public, max-age=31536000, immutable";
    default                                     "public, max-age=300";
}

server {
    listen 80;
    listen [::]:80;
    server_name zuacaldeira.com www.zuacaldeira.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://zuacaldeira.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zuacaldeira.com;

    ssl_certificate     /etc/letsencrypt/live/zuacaldeira.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zuacaldeira.com/privkey.pem;
    include /etc/nginx/snippets/zuacaldeira-ssl-params.conf;

    return 301 https://zuacaldeira.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zuacaldeira.com;

    ssl_certificate     /etc/letsencrypt/live/zuacaldeira.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zuacaldeira.com/privkey.pem;
    include /etc/nginx/snippets/zuacaldeira-ssl-params.conf;

    root /var/www/zuacaldeira.com;
    index index.html;

    # Hashed bundles are immutable and cached hard; HTML stays fresh so deploys show quickly.
    add_header Cache-Control $zc_live_cache_control always;

    # Prerendered routes resolve to <route>/index.html; anything unknown
    # falls back to the client-rendered shell so the Angular router can 404.
    location / {
        try_files $uri $uri/ /index.csr.html;
    }
}

