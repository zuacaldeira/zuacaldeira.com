# next.zuacaldeira.com — preview of the redesign. Installed as
# /etc/nginx/sites-available/next.zuacaldeira.com on the shared VPS (docs/deploy-next.md).
#
# The host nginx owns :80/:443 for every site on this host. Here it terminates TLS
# (certbot webroot, renewed by the host's timer), adds the security headers and proxies
# to the web container on 127.0.0.1:3130 (docker-compose.yml). Cache-Control comes from
# the container.
#
# Keep add_header at server level only: a location with its own add_header drops every
# server-level header for its responses.

server {
    listen 80;
    listen [::]:80;
    server_name next.zuacaldeira.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://next.zuacaldeira.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name next.zuacaldeira.com;

    ssl_certificate     /etc/letsencrypt/live/next.zuacaldeira.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/next.zuacaldeira.com/privkey.pem;
    include /etc/nginx/snippets/zuacaldeira-ssl-params.conf;

    # Work in progress: keep it out of search results (robots.txt says the same).
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3130;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
