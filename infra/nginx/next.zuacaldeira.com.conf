# next.zuacaldeira.com — preview of the redesign (Angular prerendered static build).
#
# Deployed from the `next` branch by .github/workflows/deploy-next.yml: files rsynced to
# /var/www/next.zuacaldeira.com. Installed as /etc/nginx/sites-available/next.zuacaldeira.com
# (see docs/deploy-next.md). Certificate by certbot webroot, renewed by the host's timer.
#
# Headers: every header is set at server level, never inside a location. A location with
# its own add_header drops all server-level headers for its responses (the live
# zuacaldeira.com config loses HSTS and CSP on pages and assets that way). Cache-Control
# varies by file type through the map below instead.

map $uri $zc_next_cache_control {
    ~*\.html$                                   "public, max-age=300";
    ~*\.(js|css|woff2?|png|jpe?g|webp|svg|ico)$ "public, max-age=31536000, immutable";
    default                                     "public, max-age=300";
}

server {
    listen 80;
    listen [::]:80;
    server_name next.zuacaldeira.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://next.zuacaldeira.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name next.zuacaldeira.com;

    ssl_certificate     /etc/letsencrypt/live/next.zuacaldeira.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/next.zuacaldeira.com/privkey.pem;
    include /etc/nginx/snippets/zuacaldeira-ssl-params.conf;

    # Work in progress: keep it out of search results (robots.txt says the same).
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control $zc_next_cache_control always;

    root /var/www/next.zuacaldeira.com;
    index index.html;

    # Prerendered routes resolve to <route>/index.html; anything unknown
    # falls back to the client-rendered shell so the Angular router can 404.
    location / {
        try_files $uri $uri/ /index.csr.html;
    }
}
