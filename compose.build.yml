# The site's build backend (D20, D26): MySQL and the content API, seeded by Flyway (db/seed),
# started for one build and thrown away after it. Nothing here is the live database.
#
#   docker compose -f compose.build.yml up --build --wait
#   CONTENT_API=http://127.0.0.1:8081 node frontend/scripts/fetch-content.mjs
#   docker compose -f compose.build.yml down -v
name: zuacaldeira-build

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: content
      MYSQL_USER: content
      MYSQL_PASSWORD: build-only
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucontent", "-pbuild-only"]
      interval: 2s
      timeout: 5s
      retries: 60

  api:
    build: backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: seed
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/content
      SPRING_DATASOURCE_USERNAME: content
      SPRING_DATASOURCE_PASSWORD: build-only
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      # Healthy once the seeded hero answers, not merely once the port is open.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/content/home/hero?lang=en HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 2s
      timeout: 5s
      retries: 60
