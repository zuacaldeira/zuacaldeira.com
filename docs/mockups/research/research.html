<!doctype html>
<html lang="en" data-frame="a" data-hero="b" data-band="c" data-opt="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alexandre Zua Caldeira, Research page mock-up</title>
<!-- Research page mock-up, one option (R1 b: a landing page for the ICE 2026 paper). Head, tokens,
     shell CSS and the glaze engine are copied unchanged from docs/mockups/writing/writing.html
     (itself from the Software and home mock-ups). -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Copied unchanged from frontend/src/styles.css. The glaze engine rewrites the colours. */
:root {
  --zc-text-heading: #0b1526;
  --zc-text-body: #12203a;
  --zc-text-muted: #556476;

  --zc-bg-white: #f7fafc;
  --zc-bg-warm: #e9eff4;
  --zc-bg-light: #dfe8f0;

  --zc-azul: #14417a;
  --zc-azul-deep: #0a2a55;
  --zc-azul-pale: #7fa5ce;
  --zc-azul-wash: #d3e0ec;

  --zc-ochre: #b07a22;
  --zc-ochre-text: #8a5e15;
  --zc-ochre-wash: #faf5ec;
  --zc-tile: #f7fafc;

  --zc-accent: #14417a;
  --zc-accent-light: #7fa5ce;
  --zc-accent-hover: #0a2a55;

  --zc-border-light: #c9d8e6;
  --zc-grout: rgba(20, 65, 122, 0.16);
  /* Lattice edges carry the diagram's meaning, so they are held at >=3:1 (WCAG 1.4.11)
     rather than reusing the decorative grout hairline, which resolves to 1.31:1. */
  --zc-edge: #6987ab;

  --zc-font-heading: 'Fraunces', Georgia, 'Times New Roman', serif;
  --zc-font-body: 'Archivo', system-ui, -apple-system, sans-serif;
  --zc-font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --zc-space-2: 0.5rem;
  --zc-space-3: 0.75rem;
  --zc-space-4: 1rem;
  --zc-space-6: 1.5rem;
  --zc-space-8: 2rem;
  --zc-space-12: 3rem;
  --zc-space-16: 4rem;
  --zc-space-24: 6rem;

  --zc-radius-sm: 0.375rem;
  --zc-radius-md: 0.5rem;
  --zc-radius-lg: 0.75rem;
  --zc-radius-xl: 1rem;
  --zc-radius-full: 9999px;

  --zc-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  --zc-shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
  --zc-shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.1);

  --zc-transition-fast: 0.15s ease;
  --zc-transition-base: 0.25s ease;
  --zc-transition-slow: 0.4s ease;

  --zc-max-width: 1100px;
}
:root{--zc-on-accent:#f7fafc;--gutter:var(--zc-space-6);--grout:color-mix(in oklab,var(--zc-edge) 28%,transparent);--foot-bg:#0b1526;--foot-fg:#e9eff4;--foot-gold:#d9a94a;--band-bg:#14417a;--band-fg:#f7fafc;--band-btn:#f7fafc;--band-btn-fg:#14417a}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:clip;max-width:100%}
body{margin:0;background:var(--zc-bg-warm);color:var(--zc-text-body);font-family:var(--zc-font-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,p{margin:0}
a{color:var(--zc-azul)}
*:focus-visible{outline:2px solid var(--zc-azul);outline-offset:2px;border-radius:2px}
.skip-link{position:absolute;top:-60px;left:0;background:var(--zc-azul);color:var(--zc-on-accent);padding:var(--zc-space-2) var(--zc-space-4);z-index:1100;font-family:var(--zc-font-mono)}
.skip-link:focus{top:0}
.col{width:100%;max-width:1200px;margin-inline:auto;padding-inline:var(--gutter)}
.mono{font-family:var(--zc-font-mono)}
.guide{position:fixed;inset:0;pointer-events:none;z-index:2000;display:none}
.guide>div{height:100%;position:relative}
.guide>div::before{content:"";position:absolute;left:var(--gutter);top:0;bottom:0;border-left:1px dashed var(--zc-ochre)}
html.guides .guide{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 22px;border-radius:2px;border:1px solid var(--zc-azul);font-size:1rem;font-weight:500;text-decoration:none;text-align:center}
.btn--fill{background:var(--zc-azul);color:var(--zc-on-accent)}
.btn--fill:hover{background:var(--zc-azul-deep);border-color:var(--zc-azul-deep)}
.btn--line{color:var(--zc-azul)}
.btn--line:hover{background:var(--zc-azul-wash)}
.tlink{display:inline-flex;align-items:center;min-height:44px;font-weight:500;text-underline-offset:3px}

/* Frame B: strip above the header. */
.strip{background:var(--zc-bg-white);border-bottom:1px solid var(--zc-border-light);font-size:.875rem}
.strip nav{display:flex;justify-content:flex-end;gap:var(--zc-space-2)}
.strip a{display:inline-flex;align-items:center;min-height:44px;padding-inline:var(--zc-space-3);color:var(--zc-text-muted);text-decoration:none}
.strip a:hover{color:var(--zc-text-heading)}
.strip a[aria-current]{color:var(--zc-text-heading);font-weight:600;text-decoration:underline;text-underline-offset:4px}

header{position:sticky;top:0;z-index:1000;background:color-mix(in srgb,var(--zc-bg-warm) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--zc-border-light)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:var(--zc-space-3);min-height:64px}
.brand{display:inline-flex;align-items:center;gap:10px;min-height:44px;min-width:44px;text-decoration:none;color:var(--zc-text-heading);flex:none}
.brand svg{width:32px;height:32px;flex:none}
.brand span{font-family:var(--zc-font-heading);font-weight:600;font-size:1.25rem;white-space:nowrap}
.menu{flex:1;display:flex;justify-content:flex-end;font-family:var(--zc-font-mono);font-size:.875rem}
.menu a{display:inline-flex;align-items:center;min-height:44px;padding-inline:var(--zc-space-3);color:var(--zc-text-body);text-decoration:none;white-space:nowrap}
.menu a:hover{color:var(--zc-azul)}
.actions{display:flex;align-items:center;gap:var(--zc-space-2);flex:none}
.cta{font-family:var(--zc-font-mono);font-size:.875rem;padding-inline:var(--zc-space-4);white-space:nowrap}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:0;border-radius:2px;background:transparent;color:var(--zc-text-heading);cursor:pointer}
.icon-btn:hover{background:var(--zc-azul-wash)}
.icon-btn svg{width:24px;height:24px;fill:currentColor}
.burger{display:none}
.codes{display:flex}
.codes a{display:inline-flex;align-items:center;justify-content:center;width:38px;height:44px;font-family:var(--zc-font-mono);font-size:.8rem;letter-spacing:.04em;color:var(--zc-text-muted);text-decoration:none}
.codes a:hover{color:var(--zc-text-heading)}
.codes a[aria-current]{color:var(--zc-text-heading);font-weight:500;text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:var(--zc-ochre);text-underline-offset:5px}
.pick{position:relative}
.pick summary{display:inline-flex;align-items:center;gap:.3rem;height:44px;padding-inline:var(--zc-space-2);font-family:var(--zc-font-mono);font-size:.8rem;color:var(--zc-text-heading);cursor:pointer;list-style:none;border-radius:2px}
.pick summary::-webkit-details-marker{display:none}
.pick summary::after{content:"";width:0;height:0;border-inline:4px solid transparent;border-top:5px solid currentColor}
.pick summary:hover{background:var(--zc-azul-wash)}
.pick ul{position:absolute;right:0;top:calc(100% + 4px);min-width:10rem;margin:0;padding:var(--zc-space-2);list-style:none;background:var(--zc-bg-white);border:1px solid var(--zc-border-light);box-shadow:var(--zc-shadow-md)}
.pick li a{display:flex;align-items:center;min-height:44px;padding-inline:var(--zc-space-3);color:var(--zc-text-body);text-decoration:none}
.pick li a:hover{background:var(--zc-azul-wash)}
.pick li a[aria-current]{font-weight:600;text-decoration:underline;text-underline-offset:4px}
.drawer{position:fixed;inset:0 0 0 auto;width:min(320px,80%);z-index:1200;background:var(--zc-bg-white);padding:var(--zc-space-2) var(--gutter);box-shadow:var(--zc-shadow-lg);overflow:auto}
.scrim{position:fixed;inset:0;z-index:1150;background:rgb(11 21 38 / .45)}
.drawer-top{display:flex;justify-content:flex-end;min-height:56px;align-items:center}
.drawer a{display:flex;align-items:center;min-height:44px;color:var(--zc-text-body);text-decoration:none;font-family:var(--zc-font-mono);font-size:.95rem}
.drawer h2{font-family:var(--zc-font-mono);font-size:.75rem;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--zc-text-muted);margin:var(--zc-space-6) 0 var(--zc-space-2)}
.drawer a[aria-current]{font-weight:500;text-decoration:underline;text-underline-offset:4px}

@media (max-width:980px){.menu a{padding-inline:var(--zc-space-2)}.cta{padding-inline:var(--zc-space-3)}.brand span{font-size:1.1rem}.bar{gap:var(--zc-space-2)}.actions{gap:0}html[data-frame="a"] .brand span,html[data-frame="c"] .brand span{display:none}}
/* The CDK Handset query, as the real ZcPage uses it. */
@media (max-width:599.98px) and (orientation:portrait),(max-width:959.98px) and (orientation:landscape){
  :root{--gutter:var(--zc-space-4)}
  .menu,.cta,.pick-bar{display:none}
  .burger{display:inline-flex}
  .bar{min-height:56px;gap:0}
  .actions{gap:0}
  .codes a{width:44px}
  html[data-frame="a"] .brand span{display:none}
  .strip nav{justify-content:flex-start}
  .strip a:first-child{margin-inline-start:calc(var(--zc-space-3) * -1)}
}

/* Hero */
.hero{position:relative;overflow:hidden;padding-block:clamp(40px,6vw,80px) clamp(32px,5vw,72px)}
html[data-hero="b"] .hero{background-image:repeating-linear-gradient(45deg,transparent 0 31px,var(--grout) 31px 32px),repeating-linear-gradient(-45deg,transparent 0 31px,var(--grout) 31px 32px)}
.hero__in{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:48px;align-items:center}
.hero__text{display:flex;flex-direction:column;gap:clamp(18px,2vw,26px);min-width:0}
.eyebrow{font-family:var(--zc-font-mono);font-size:.875rem;color:var(--zc-ochre-text)}
.hero h1{font-family:var(--zc-font-heading);font-optical-sizing:auto;font-weight:600;font-size:clamp(2.5rem,5vw,4.25rem);line-height:1.03;letter-spacing:-.025em;color:var(--zc-text-heading);text-wrap:balance;overflow-wrap:break-word}
.lede{font-size:clamp(1.0625rem,1.5vw,1.25rem);max-width:40rem}
.hero__actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.lat{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.lat svg{width:100%;max-width:440px;height:auto;overflow:visible}
.lat line{stroke:var(--zc-edge);stroke-width:1.6;stroke-linecap:round}
.lat .inner{fill:var(--zc-edge)}
.lat .top{fill:var(--zc-ochre)}
.lat .atom{fill:var(--zc-azul)}
.lat .bot{fill:var(--zc-bg-warm);stroke:var(--zc-azul);stroke-width:2.5}
.lat text{font-family:var(--zc-font-mono);font-size:14px;fill:var(--zc-azul)}
.lat .halo{fill:var(--zc-bg-warm);stroke:var(--zc-bg-warm);stroke-width:6px;stroke-linejoin:round}
.lat a text:not(.halo){text-decoration:underline;text-underline-offset:2px}
.lat .ttop{font-family:var(--zc-font-heading);font-weight:600;font-size:16px;fill:var(--zc-text-heading)}
.lat .hit{fill:transparent;stroke:none}
.lat a:focus{outline:none}
.lat a:focus-visible .hit{stroke:var(--zc-azul);stroke-width:2}
.lat a:hover text{fill:var(--zc-azul-deep)}
.lat figcaption{font-family:var(--zc-font-mono);font-size:.75rem;color:var(--zc-text-muted);text-align:center}
.wallbox{display:none}
.credit{display:none;font-family:var(--zc-font-mono);font-size:.7rem;color:var(--zc-text-muted)}
html[data-hero="c"] .lat{display:none}
html[data-hero="c"] .hero__in{grid-template-columns:minmax(0,36rem)}
html[data-hero="c"] .wallbox{display:block;position:absolute;inset:0 0 0 max(58%,calc(50% + 8rem));-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 30%);mask-image:linear-gradient(90deg,transparent 0%,#000 30%)}
html[data-hero="c"] .credit{display:block;margin-top:var(--zc-space-2)}
.wall{display:block;width:100%;height:100%}
.wall .t rect{fill:transparent;stroke:var(--grout);stroke-width:.8}
.wall .t line{stroke:var(--zc-edge);stroke-width:1.1}
.wall .t circle{fill:var(--zc-edge)}
.wall .nd line{stroke:var(--zc-ochre)}
.wall .nd circle{fill:var(--zc-ochre)}
@media (max-width:900px){
  .hero__in{grid-template-columns:minmax(0,1fr);gap:32px}
  .lat svg{max-width:342px}
  html[data-hero="c"] .wallbox{inset:auto 0 0 0;height:170px;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 60%);mask-image:linear-gradient(180deg,transparent 0%,#000 60%)}
  html[data-hero="c"] .hero{padding-bottom:190px}
}
@media (max-width:480px){
  .hero__actions .btn{width:100%}
}

.later{font-family:var(--zc-font-mono);font-size:.75rem;color:var(--zc-text-muted);border-block:1px dashed var(--zc-border-light);padding-block:var(--zc-space-4)}

/* Theorem band */
.band{background:var(--band-bg);color:var(--band-fg)}
.band__in{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:64px;align-items:center;padding-block:clamp(48px,6vw,88px)}
.band__text{display:flex;flex-direction:column;gap:clamp(16px,2vw,24px);min-width:0}
.band__paper,.band__kind{font-family:var(--zc-font-mono);font-size:.875rem}
.band__paper{letter-spacing:.02em}
.band__stmt{font-family:var(--zc-font-heading);font-size:clamp(1.6rem,3.2vw,2.5rem);line-height:1.2;font-weight:400}
.band .m{font-family:var(--zc-font-mono);font-size:.9em}
.band__ev{font-size:1.0625rem;max-width:40rem}
.band__actions{display:flex;flex-wrap:wrap;gap:12px}
.band .btn--fill{background:var(--band-btn);border-color:var(--band-btn);color:var(--band-btn-fg)}
.band .btn--fill:hover{background:transparent;color:var(--band-fg)}
.band .btn--line{border-color:var(--band-fg);color:var(--band-fg)}
.band .btn--line:hover{background:var(--band-fg);color:var(--band-bg)}
.band *:focus-visible{outline-color:var(--band-fg)}
.band svg{width:100%;max-width:340px;height:auto;justify-self:center}
.band svg line{stroke:var(--band-fg);stroke-width:1.4;stroke-linecap:round}
.band svg .inner,.band svg .atom{fill:var(--band-fg)}
.band svg .top{fill:var(--zc-ochre);stroke:var(--band-fg);stroke-width:2}
.band svg .bot{fill:var(--band-bg);stroke:var(--band-fg);stroke-width:2.5}
.stmts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--zc-space-8);padding-top:var(--zc-space-6);border-top:1px solid var(--band-fg)}
.stmts p{font-family:var(--zc-font-heading);font-size:1.0625rem;line-height:1.5;margin-top:var(--zc-space-2)}
.band details summary{display:inline-flex;align-items:center;gap:.5rem;min-height:44px;cursor:pointer;font-weight:500;text-decoration:underline;text-underline-offset:3px;list-style:none}
.band details summary::-webkit-details-marker{display:none}
.band details summary::before{content:"+";font-family:var(--zc-font-mono)}
.band details[open] summary::before{content:"−"}
.band details .stmts{margin-top:var(--zc-space-4)}
html:not([data-band="b"]) .opt-b{display:none}
html:not([data-band="c"]) .opt-c{display:none}
@media (max-width:900px){.band__in{grid-template-columns:minmax(0,1fr);gap:32px}.stmts{grid-template-columns:minmax(0,1fr)}.band svg{max-width:240px}.band .m{white-space:normal}}

/* 404, wording agreed in D9 */
.nf{padding-block:clamp(64px,10vw,120px);min-height:50vh}
.nf h1{font-family:var(--zc-font-heading);font-weight:600;font-size:clamp(2rem,5vw,3.25rem);line-height:1.15;color:var(--zc-text-heading);margin-bottom:var(--zc-space-4)}
.nf h1 span{font-family:var(--zc-font-mono);font-weight:500;color:var(--zc-azul)}
.nf p{font-size:1.125rem;max-width:65ch;margin-bottom:var(--zc-space-6)}

/* Ink footer, as on the v2 boards. */
footer{background:var(--foot-bg);color:var(--foot-fg)}
footer a{color:var(--foot-fg);text-underline-offset:3px}
footer *:focus-visible{outline-color:var(--foot-fg)}
.foot__top{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:clamp(32px,5vw,64px);align-items:end;padding-block:clamp(48px,6vw,80px) var(--zc-space-8)}
.foot__copy{display:flex;flex-direction:column;gap:var(--zc-space-4)}
.foot__end{font-family:var(--zc-font-mono);font-size:.875rem;color:var(--foot-gold)}
footer h2{font-family:var(--zc-font-heading);font-weight:600;font-size:clamp(1.8rem,3.2vw,2.75rem);line-height:1.08;color:var(--foot-fg)}
.foot__contact{display:flex;flex-direction:column;gap:var(--zc-space-3);align-items:flex-start;min-width:0}
.foot__mail{background:var(--foot-gold);border-color:var(--foot-gold);color:#1a1205;overflow-wrap:anywhere}
.foot__links{display:flex;flex-wrap:wrap;gap:0 var(--zc-space-4);font-family:var(--zc-font-mono);font-size:.875rem}
.foot__links a{display:inline-flex;align-items:center;min-height:44px}
.ann{font-family:var(--zc-font-mono);font-size:.7rem;background:#9e2b25;color:#fff;padding:2px 7px;white-space:nowrap}
.foot__bottom{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--zc-space-2) var(--zc-space-6);border-top:1px solid color-mix(in srgb,var(--foot-fg) 25%,transparent);padding-block:var(--zc-space-3);font-family:var(--zc-font-mono);font-size:.75rem}
.foot__langs{display:flex;gap:var(--zc-space-2)}
.foot__langs a{display:inline-flex;align-items:center;min-height:44px;padding-inline:var(--zc-space-2)}
.foot__langs a[aria-current]{font-weight:500}
@media (max-width:720px){.foot__top{grid-template-columns:minmax(0,1fr)}}


/* ---------- Research page (new). Tokens only; the annotation red is the home mock-up's .ann.
   Head, kicker, placeholder, source and lead styles are the Writing mock-up's, unchanged. ---------- */
.menu a[aria-current],.drawer nav a[aria-current]{color:var(--zc-text-heading);font-weight:500;text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:var(--zc-ochre);text-underline-offset:5px}
h2,h3{margin:0}
.k{font-family:var(--zc-font-mono);font-size:.8125rem;letter-spacing:.02em;color:var(--zc-ochre-text)}
.ph{display:inline;padding:2px 4px;background:color-mix(in srgb,var(--zc-bg-white) 70%,transparent);outline:1px dashed #9e2b25;outline-offset:1px;color:var(--zc-text-body)}
.ph .ann{margin-inline-end:.35em}
.src{display:none;font-family:var(--zc-font-mono);font-size:.6875rem;line-height:1.3;color:var(--zc-text-muted);border-left:2px solid var(--zc-ochre);padding-left:6px;margin-top:4px}
html.sources .src{display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* Page head: PageHead, as on the Software and Writing pages. */
.sw-head{padding-block:clamp(36px,5vw,64px) clamp(28px,4vw,48px);background-image:repeating-linear-gradient(45deg,transparent 0 31px,var(--grout) 31px 32px),repeating-linear-gradient(-45deg,transparent 0 31px,var(--grout) 31px 32px);border-bottom:1px solid var(--zc-border-light)}
.sw-head .col{display:flex;flex-direction:column;gap:var(--zc-space-4)}
.sw-head h1{font-family:var(--zc-font-heading);font-optical-sizing:auto;font-weight:600;font-size:clamp(2.5rem,5vw,4rem);line-height:1.03;letter-spacing:-.025em;color:var(--zc-text-heading)}
.sw-head .intro{font-size:clamp(1.0625rem,1.5vw,1.25rem);max-width:40rem}
.sec{padding-block:clamp(40px,6vw,80px)}
.sec+.sec{border-top:1px solid var(--zc-border-light)}
.sec-h{font-family:var(--zc-font-heading);font-weight:600;font-size:clamp(1.6rem,3vw,2.25rem);line-height:1.12;color:var(--zc-text-heading);margin-bottom:var(--zc-space-6)}
.ptitle{font-family:var(--zc-font-heading);font-weight:600;color:var(--zc-text-heading);line-height:1.18;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:break-word}
.prose{max-width:65ch}

/* 1. The paper: the Writing mock-up's lead card (ochre top), the abstract in the wide column. */

/* The glaze engine, copied unchanged from the Living Glaze study. */
const toLin = c => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  const toGam = c => (c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055);
  const hexToRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
  const rgbToHex = rgb => '#' + rgb.map(v => Math.round(Math.min(1, Math.max(0, v)) * 255).toString(16).padStart(2, '0')).join('');

  function rgbToLab([r, g, b]) {
    r = toLin(r); g = toLin(g); b = toLin(b);
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    return [
      0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s,
      1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s,
      0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s,
    ];
  }
  function labToRgb([L, a, b]) {
    const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
    const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
    const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
    return [
      4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
      -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
      -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
    ].map(v => toGam(Math.min(1, Math.max(0, v))));
  }
  const lum = rgb => { const [r, g, b] = rgb.map(toLin); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
  const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const mixLab = (p, q, t) => p.map((v, i) => v + (q[i] - v) * t);

  // ---------- the five glazes ----------
  const GLAZES = {
    cobalto: {
      name: 'Cobalto', mode: 'light', when: 'noon',
      desc: 'Today\'s light theme. Blue-and-white tile, the Lisbon original.',
      c: { bg: '#e9eff4', surface: '#f7fafc', raised: '#dfe8f0', wash: '#d3e0ec', border: '#c9d8e6',
           heading: '#0b1526', body: '#12203a', muted: '#556476', accent: '#14417a', accentHover: '#0a2a55',
           onAccent: '#f7fafc', ochre: '#b07a22', ochreText: '#8a5e15', edge: '#6987ab' },
    },
    amarelo: {
      name: 'Amarelo e verde', mode: 'light', when: 'afternoon',
      desc: 'The polychrome tiles of the 1600s: tin-white glaze, copper green, antimony yellow.',
      c: { bg: '#f2eedf', surface: '#faf8ef', raised: '#e9e3cc', wash: '#e4e4ca', border: '#dcd5b8',
           heading: '#17190f', body: '#23261a', muted: '#5a5a44', accent: '#2f5b3b', accentHover: '#1f4029',
           onAccent: '#faf8ef', ochre: '#b07a22', ochreText: '#7c5512', edge: '#868260' },
    },
    manganes: {
      name: 'Manganês', mode: 'light', when: 'dawn',
      desc: 'The purple-brown of manganese oxide, the oldest tile outline colour.',
      c: { bg: '#f0ebf2', surface: '#faf7fb', raised: '#e6dfeb', wash: '#e3d8ea', border: '#d9cde2',
           heading: '#1b1026', body: '#271a33', muted: '#5f526b', accent: '#5b2f73', accentHover: '#3f1d52',
           onAccent: '#faf7fb', ochre: '#a8741f', ochreText: '#80561a', edge: '#8c7a9c' },
    },
    manganesNoite: {
      name: 'Manganês nocturno', mode: 'dark', when: 'evening',
      desc: 'Manganese fired dark. The bridge from dusk into the night glaze.',
      c: { bg: '#160f1f', surface: '#1f1629', raised: '#2a1f37', wash: '#2a1f37', border: '#3b2d4b',
           heading: '#f0e8f4', body: '#e0d4e8', muted: '#a093ad', accent: '#c4a3dc', accentHover: '#dcc4ec',
           onAccent: '#160f1f', ochre: '#d9a94a', ochreText: '#d9a94a', edge: '#76638c' },
    },
    noite: {
      name: 'Vidrado nocturno', mode: 'dark', when: 'night',
      desc: 'Today\'s dark theme. The tile fires darker and the blue lifts to read against it.',
      c: { bg: '#0b1526', surface: '#12203a', raised: '#17294a', wash: '#17294a', border: '#2a3f63',
           heading: '#e9eff4', body: '#d3e0ec', muted: '#8496ab', accent: '#7fa5ce', accentHover: '#a8c4de',
           onAccent: '#0b1526', ochre: '#d9a94a', ochreText: '#d9a94a', edge: '#516b8b' },
    },
  };
  const ORDER = ['manganes', 'cobalto', 'amarelo', 'manganesNoite', 'noite'];
  const SURFACES = ['bg', 'surface', 'raised', 'wash', 'border'];
  const INKS = ['heading', 'body', 'muted', 'accent', 'accentHover', 'ochre', 'ochreText', 'edge', 'onAccent'];
  const CSSVAR = { accentHover: '--accent-hover', onAccent: '--on-accent', ochreText: '--ochre-text' };
  const varName = k => CSSVAR[k] || '--' + k;

  for (const g of Object.values(GLAZES)) {
    g.lab = {};
    for (const [k, hex] of Object.entries(g.c)) g.lab[k] = rgbToLab(hexToRgb(hex));
  }

  // Keyframes in hours. Between two keyframes with different modes is a crossing.
  const KEYS = [
    [0, 'noite'], [5, 'noite'], [6, 'manganesNoite'],
    [6.5, 'manganes'], [10, 'cobalto'], [15, 'cobalto'],
    [18, 'amarelo'], [19.5, 'amarelo'], [20, 'manganesNoite'],
    [23, 'noite'], [24, 'noite'],
  ];

  // Minimum contrast against both bg and surface (onAccent: against accent).
  const GUARDS = [
    ['heading', 4.5], ['body', 4.5], ['muted', 4.5], ['accent', 4.5], ['accentHover', 4.5],
    ['ochreText', 4.5], ['ochre', 3], ['edge', 3],
  ];

  const smooth = t => t * t * (3 - 2 * t);
  const BLACK = [0, 0, 0], WHITE = [1, 0, 0];

  function guard(lab, against, target) {
    const rgb = labToRgb(lab);
    const worst = c => Math.min(...against.map(b => contrast(c, b)));
    if (worst(rgb) >= target) return { lab, moved: false };
    const toward = worst([0, 0, 0]) > worst([1, 1, 1]) ? BLACK : WHITE;
    let lo = 0, hi = 1;
    for (let i = 0; i < 18; i++) {
      const mid = (lo + hi) / 2;
      if (worst(labToRgb(mixLab(lab, toward, mid))) >= target) hi = mid; else lo = mid;
    }
    return { lab: mixLab(lab, toward, hi), moved: true };
  }

  function themeAt(minutes) {
    const h = ((minutes / 60) % 24 + 24) % 24;
    let i = 0;
    while (i < KEYS.length - 2 && h >= KEYS[i + 1][0]) i++;
    const [h0, k0] = KEYS[i], [h1, k1] = KEYS[i + 1];
    const a = GLAZES[k0], b = GLAZES[k1];
    const t = h1 > h0 ? smooth((h - h0) / (h1 - h0)) : 0;
    const lab = {};
    for (const k of SURFACES) lab[k] = mixLab(a.lab[k], b.lab[k], t);

    const crossing = a.mode !== b.mode;
    let inkSide = null;
    if (crossing) {
      // Snap inks to whichever side the background currently belongs to.
      const bgRgb = labToRgb(lab.bg);
      const darkBg = contrast([1, 1, 1], bgRgb) > contrast([0, 0, 0], bgRgb);
      inkSide = (a.mode === 'dark') === darkBg ? a : b;
      for (const k of INKS) lab[k] = inkSide.lab[k];
    } else {
      for (const k of INKS) lab[k] = mixLab(a.lab[k], b.lab[k], t);
    }

    const rgb = {};
    for (const k of SURFACES) rgb[k] = labToRgb(lab[k]);
    const against = [rgb.bg, rgb.surface];
    const moved = [];
    for (const [k, target] of GUARDS) {
      const r = guard(lab[k], against, target);
      lab[k] = r.lab;
      if (r.moved) moved.push(k);
    }
    const accRgb = labToRgb(lab.accent);
    const oa = guard(lab.onAccent, [accRgb], 4.5);
    lab.onAccent = oa.lab;
    if (oa.moved) moved.push('onAccent');

    const hex = {};
    for (const k of [...SURFACES, ...INKS]) hex[k] = rgbToHex(labToRgb(lab[k]));
    const darkBg = contrast([1, 1, 1], labToRgb(lab.bg)) > contrast([0, 0, 0], labToRgb(lab.bg));
    return { hex, from: a, to: b, t, crossing, moved, mode: darkBg ? 'dark' : 'light' };
  }

const STATE_MIN={light:750,dark:120};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
function paint(){
  const th=themeAt(view.state==='living'?view.minutes:STATE_MIN[view.state]);
  const r=document.documentElement.style;

  document.documentElement.style.colorScheme=dark?'dark':'light';
  document.documentElement.dataset.mode=th.mode;
}

/* The paper: from ContentService.publications[0]. Title, name, venue and abstract are never translated. */
const PAPER={year:2026,title:'Session Type State Spaces Form Lattices',author:'Alexandre Zua Caldeira',
 venue:'ICE 2026 · International Workshop on Interaction and Concurrency Experience',
 pdf:'/assets/pdfs/SessionTypeStateSpacesFormLattices-CameraReady.pdf',
 abstract:'We prove that the state space of every well-formed session type, quotiented by strongly connected components, forms a bounded lattice; n-ary parallel composition yields product lattices. Two consequences follow: duality preserves the lattice up to isomorphism, and Gay–Hole width subtyping corresponds to lattice embedding for non-recursive types. We validate this on 108 benchmark protocols across networking, databases, distributed systems, AI, and fault tolerance: all form lattices, 93 distributive, 15 non-distributive. Mechanised in Lean 4 with two independently developed tool implementations.'};

const view={lang:'en',state:'living',minutes:nowMin()};
const q1=new URLSearchParams(location.hash.slice(1));
for(const k of['lang','state'])if(q1.get(k))view[k]=q1.get(k);
if(q1.get('t'))view.minutes=+q1.get('t');
if(q1.get('src')==='1')document.documentElement.classList.add('sources');

let P,LG;
const src=k=>`<span class="src">from: ${SRC[k]}</span>`;
const draft=x=>`<span class="ph"><span class="ann">${P.draftTag}</span>${x}</span>`;
const ph=x=>`<span class="ph"><span class="ann">${P.phTag}</span>${x}</span>`;
const en=()=>LG==='en'?'':' lang="en"';
const langLine=()=>LG==='en'?'':`<p class="lang">${P.inEn}</p>`;
const out=(href,label)=>`<a class="go" href="${href}" target="_blank" rel="noopener noreferrer">${label}<span class="out" aria-hidden="true">↗</span><span class="vh"> (${P.newTab})</span></a>`;

function page(){
 const p=PAPER;
 return `<section class="sw-head"><div class="col">
  <p class="eyebrow">${draft(P.eyebrow)}</p><h1>${P.h1}</h1><p class="intro">${draft(P.intro)}</p>${src('intro')}
 </div></section>

 <section class="sec" aria-labelledby="paper-t"><div class="col">
  <article class="lead">
   <div class="lead__main">
    <p class="k"><span class="mono" style="font-weight:500;color:var(--zc-text-heading)">${p.year}</span> · ${P.kind}</p>
    <h2 class="ptitle" id="paper-t" translate="no"${en()}>${p.title}</h2>
    <p class="authors" translate="no"><b>${p.author}</b></p>
    <p class="venue" translate="no">${p.venue}</p>
    <p class="note">${P.note}</p>${src('paper')}
    <a class="btn btn--fill" href="${p.pdf}" hreflang="en" type="application/pdf">${P.read}</a>
   </div>
   <div class="lead__side">
    <h3 class="k">${P.abs}</h3>${langLine()}
    <blockquote style="margin:0" translate="no"${en()}><p class="abstract prose">${p.abstract}</p></blockquote>${src('abs')}
   </div>
  </article>
 </div></section>

 <section class="sec" aria-labelledby="res-h"><div class="col">
  <h2 class="sec-h" id="res-h">${draft(P.resH)}</h2>
  <blockquote class="thm"><p class="thm-k">${P.theorem} 15 · <span translate="no">Reticulate Theorem</span></p>
   <p translate="no"${en()}>For every well-formed session type <span class="m">S</span>, <span class="m">ℒ(S)/≡</span> is a bounded lattice.</p></blockquote>${src('thm')}
  <div class="stmts">
   <blockquote><p class="thm-k">${P.definition} 6 · <span translate="no">SCC quotient</span></p>
    <p translate="no"${en()}>The SCC quotient <span class="m">ℒ(S)/≡</span> identifies mutually reachable states, collapsing each recursion cycle to one class. It is ordered by <span class="m">[s₁] ≤ [s₂]</span> iff <span class="m">s₂ ↠ s₁</span>: a state is smaller when less of the protocol remains, so execution descends from <span class="m">q⊤</span> to <span class="m">q⊥</span>.</p></blockquote>
   <blockquote><p class="thm-k">${P.lemma} 8 · <span translate="no">End</span></p>
    <p translate="no"${en()}><span class="m">ℒ(end)/≡</span> is a bounded lattice.</p></blockquote>
   <blockquote><p class="thm-k">${P.proposition} 18 · <span translate="no">Duality isomorphism</span></p>
    <p translate="no"${en()}>For every well-formed session type <span class="m">S</span>, there is a bounded-lattice isomorphism <span class="m">ℒ(S)/≡ ≅ ℒ(dual(S))/≡</span>.</p></blockquote>
  </div>${src('stm')}
 </div></section>

 <section class="sec" aria-labelledby="chk-h"><div class="col">
  <h2 class="sec-h" id="chk-h">${draft(P.chkH)}</h2>
  <dl class="figs">
   <div class="fig"><dt>108</dt><dd>${draft(P.f108)}</dd></div>
   <div class="fig"><dt>93</dt><dd>${draft(P.f93)}</dd></div>
   <div class="fig"><dt>15</dt><dd>${draft(P.f15)}</dd></div>
   <div class="fig"><dt translate="no">Lean 4</dt><dd>${draft(P.fLean)}</dd></div>
  </dl>${src('figs')}
  <p class="ev prose">${P.ev}</p>${src('ev')}
 </div></section>

 <section class="sec" aria-labelledby="tool-h"><div class="col">
  <h2 class="sec-h" id="tool-h">${draft(P.toolH)}</h2>
  <div class="row">
   <p class="k">${P.toolK}</p>
   <div class="row__body">
    <h3 class="ptitle" translate="no">reticulateP</h3>
    <p class="prose">${P.toolT}</p>
    <p class="stack" translate="no">Python</p>
    <a class="go" href="/${LG}/software">${draft(P.toolGo)}</a>${src('tool')}
   </div>
  </div>
 </div></section>

 <section class="sec" aria-labelledby="next-h"><div class="col">
  <h2 class="sec-h" id="next-h">${draft(P.nextH)}</h2>
  <div class="phblock"><p><span class="ann">${P.phTag}</span> For Zua: what follows from the paper, such as the questions it leaves open, work in progress, or an invitation to collaborate. Not built until you write it: the page goes from "The tool" to "More research" (D1 in research.md).</p></div>
 </div></section>

 <section class="more" aria-labelledby="more-h"><div class="col"><div style="border-top:1px solid var(--zc-border-light);padding-top:var(--zc-space-6)">
  <h2 id="more-h">${draft(P.moreH)}</h2>
  <ul>
   <li><a class="go" href="/${LG}/writing">${draft(P.earlier)}</a></li>
   <li>${out('https://www.researchgate.net/profile/Alexandre-Caldeira','ResearchGate')}</li>
  </ul>${src('wr')}${src('rg')}
 </div></div></section>`;
}

function langLink(l,label,shown){const a=document.createElement('a');a.href='/'+l+'/research';a.hreflang=l;a.lang=l;a.textContent=label;if(label.length===2)a.setAttribute('aria-label',NAMES[l]+' ('+l.toUpperCase()+')');if(l===shown)a.setAttribute('aria-current','true');a.addEventListener('click',ev=>{ev.preventDefault();closeDrawer();tell({lang:l})});return a}
function render(){
 LG=view.lang;P=PAGE[LG];const t=SHELL[LG];
 document.documentElement.lang=LG;
 document.title='Alexandre Zua Caldeira — '+P.h1;
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);
 document.querySelectorAll('[data-mainnav]').forEach(n=>{const items=[...t.nav];if(n.dataset.mainnav==='drawer')items.push(['contact',t.contact]);n.setAttribute('aria-label','Main');n.replaceChildren(...items.map(([s,x])=>{const a=document.createElement('a');a.href='/'+LG+'/'+s;a.textContent=x;if(s==='research')a.setAttribute('aria-current','page');return a}))});
 document.querySelectorAll('[data-langnav]').forEach(n=>{const k=n.dataset.langnav;n.setAttribute('aria-label',t.language);
  n.replaceChildren(...L.map(l=>langLink(l,k==='codes'?l.toUpperCase():NAMES[l],LG)))});
 document.querySelectorAll('[data-home]').forEach(a=>a.href='/'+LG+'/home');
 document.getElementById('main').innerHTML=page();
 const th=document.getElementById('theme');th.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[view.state]+'</svg>';th.setAttribute('aria-label',t.themeL[view.state]);th.title=t.themeL[view.state];
 document.getElementById('open-menu').setAttribute('aria-label',t.open);document.getElementById('close-menu').setAttribute('aria-label',t.close);
 paint();
}
function tell(p){Object.assign(view,p);render();if(parent!==window)parent.postMessage({zcResearch:true,...p},'*')}
const drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim');
function closeDrawer(){drawer.hidden=true;scrim.hidden=true}
document.getElementById('open-menu').onclick=()=>{drawer.hidden=false;scrim.hidden=false;document.getElementById('close-menu').focus()};
document.getElementById('close-menu').onclick=closeDrawer;scrim.onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
/* No backend: links that would leave the mock-up do nothing; the skip link works. */
document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a||a.closest('[data-langnav]'))return;const h=a.getAttribute('href')||'';if(!h.startsWith('#')||h==='#')e.preventDefault()});
document.getElementById('theme').onclick=()=>{const order=['living','light','dark'];tell({state:order[(order.indexOf(view.state)+1)%3]})};
window.addEventListener('message',e=>{const m=e.data;if(!m||!m.zcSet)return;for(const k of['lang','state','minutes'])if(k in m)view[k]=m[k];document.documentElement.classList.toggle('sources',!!m.src);render()});
render();
</script>
