name: Deploy next to VPS

# The preview of the redesign: next.zuacaldeira.com, a web container on the shared VPS
# behind the host nginx. Setup and the server-side files: docs/deploy-next.md, infra/next/.

on:
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-next
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/zuacaldeira/zuacaldeira.com-web

jobs:
  # Tests, the build's own backend, the snapshot, the prerender and the acceptance tests.
  build:
    uses: ./.github/workflows/build-site.yml
    with:
      preview: true

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The image only packs the built site; frontend/Dockerfile no longer builds it.
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: frontend/dist/zuacaldeira-com/browser

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.IMAGE }}:next
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/zuacaldeira/zuacaldeira.com
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # The token on stdin lets the server pull the image; it expires with this job.
      - name: Pull and restart the container
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy_key \
            deploy-zuacaldeira@${{ secrets.DEPLOY_HOST }} sudo /usr/local/bin/zc-next-deploy

      - name: Verify deployment
        run: |
          sleep 3
          curl -sf -o /dev/null -w "https://next.zuacaldeira.com -> %{http_code}\n" https://next.zuacaldeira.com
