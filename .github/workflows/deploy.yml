name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The same build as next (build-site.yml): tests, the build's own backend, the snapshot,
  # the prerender and the acceptance tests. Not a preview: no robots.txt Disallow.
  build:
    uses: ./.github/workflows/build-site.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync to VPS
        run: |
          rsync -az --delete --exclude CNAME \
            -e "ssh -i ~/.ssh/deploy_key" \
            site/ \
            deploy-zuacaldeira@${{ secrets.DEPLOY_HOST }}:/var/www/zuacaldeira.com/

      - name: Verify deployment
        run: |
          curl -sf -o /dev/null -w "https://zuacaldeira.com -> %{http_code}\n" https://zuacaldeira.com
